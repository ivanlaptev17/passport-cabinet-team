services:
  db:
    image: postgres:16
    container_name: project_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: project_redis
    restart: always
    # Кэш и pub/sub — источник правды в постгресе, персистентность не нужна
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    container_name: project_backend
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # === DEV-фронтенд ===
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: project_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app            # монтируем исходники, чтобы Vite следил за изменениями
      - /app/node_modules          # анонимный том – не подменяем node_modules из образа
    environment:
      - CHOKIDAR_USEPOLLING=true   # иногда нужно для отслеживания изменений внутри контейнера
    depends_on:
      - backend
    profiles:
      - dev                        # запускается только с явным профилем

  # === PROD-фронтенд ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: project_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    profiles:
      - prod

volumes:
  pgdata: